server:
  port: 8082

spring:
  application:
    name: simob-api
  datasource:
    url: jdbc:postgresql://localhost:5432/simob_v02
    username: usuario_v02
    password: senha_v02
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true